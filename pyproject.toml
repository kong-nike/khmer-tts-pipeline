[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "khmertts"
version = "0.1.0"
description = "Data pipeline and baseline tooling for Khmer text-to-speech"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Lean Sokkong" }]

[tool.setuptools.packages.find]
where = ["src"]
